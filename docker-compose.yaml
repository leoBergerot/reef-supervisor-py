name: reef-supervisor

services:
  api:
    build:
      context: .
      target: development
    container_name: reef-fast-api
    ports:
      - "8080:8000"
    volumes:
      - .:/app
      - reef-uploads:/data/uploads
    environment:
      DATABASE_URL: postgresql+psycopg://reef:reef@database:5432/reef
      SECRET_KEY: dev-only-change-me-not-for-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      DEBUG: "true"
      UPLOAD_DIR: /data/uploads
      KEEP_ROOT: "true"
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SECRET_KEY: ""
      MAIL_DRIVER: smtp
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      EMAIL_FROM: contact@reef-supervisor.fr
      FRONTEND_BASE_URL: http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
      maildev:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - reef

  database:
    image: postgres:18
    container_name: reef-database
    environment:
      POSTGRES_DB: reef
      POSTGRES_USER: reef
      POSTGRES_PASSWORD: reef
    ports:
      - "5432:5432"
    volumes:
      - reef-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reef -d reef"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - reef

  maildev:
    image: maildev/maildev:2.1.0
    container_name: reef-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - reef

volumes:
  reef-postgres:
  reef-uploads:

networks:
  reef:
    driver: bridge
